services:
  devbox:
    image: node:26
    working_dir: /app
    volumes:
      - .:/app
      - devbox_node_modules:/app/node_modules
      - ./logs:/app/logs
    ports:
      - "5173:5173"
    command:
      - sh
      - -c
      - |
        npm install
        mkdir -p logs
        npm run dev -- --host &
        npm run cssw &
        npm run test &
        wait
    tty: true

volumes:
  devbox_node_modules:
